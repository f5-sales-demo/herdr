name: Downstream release

# Release contract and credential setup: .github/DOWNSTREAM_DEPLOYMENT.md

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [build-xcsh]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing fork tag whose failed asset build should be retried
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: downstream-release-build-xcsh
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release || steps.retry.outputs.release }}
      version: ${{ steps.plan.outputs.version || steps.retry.outputs.version }}
      release_sha: ${{ steps.publish.outputs.release_sha || steps.retry.outputs.release_sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tag || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - id: plan
        if: github.event_name == 'workflow_run'
        name: Derive the next fork version
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch origin build-xcsh --tags --force
          if [ "$(git rev-parse origin/build-xcsh)" != "$EXPECTED_SHA" ]; then
            echo "The branch moved after this CI run; a newer run will plan the release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git log -1 --format=%s | grep -Eq '^chore\(release\): v'; then
            echo "Release commit detected; it does not create another release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base_tag="$(git describe --first-parent --tags --match 'v[0-9]*' --abbrev=0 HEAD)"
          current="$(sed -n 's/^version = "\([0-9][0-9.]*\)"/\1/p' Cargo.toml | head -1)"
          test -n "$base_tag"
          test -n "$current"
          python3 scripts/downstream_release_plan.py \
            --base "$base_tag" --head HEAD --current "$current" \
            | tee release-plan.txt
          cat release-plan.txt >> "$GITHUB_OUTPUT"

      - id: retry
        if: github.event_name == 'workflow_dispatch'
        name: Validate an existing fork tag for rebuild
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          git rev-parse "${TAG}^{commit}" >/dev/null
          version="${TAG#v}"
          test "$TAG" = "v${version}"
          current="$(sed -n 's/^version = "\([0-9][0-9.]*\)"/\1/p' Cargo.toml | head -1)"
          test "$current" = "$version"
          release_sha="$(git rev-parse "${TAG}^{commit}")"
          {
            echo "release=true"
            echo "version=$version"
            echo "release_sha=$release_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Require deployment credentials before creating a tag
        if: steps.plan.outputs.release == 'true' || steps.retry.outputs.release == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_INSTALLER_CERTIFICATE_BASE64 \
            APPLE_INSTALLER_CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID \
            HOMEBREW_TAP_TOKEN; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing required downstream release secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - id: publish
        if: steps.plan.outputs.release == 'true'
        name: Commit and tag the fork release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.plan.outputs.version }}"
          python3 scripts/downstream_release_plan.py --write-version "$version"
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): v${version}"
          git tag -a "v${version}" -m "v${version}"
          git push origin HEAD:build-xcsh --follow-tags
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: herdr-linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact: herdr-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact: herdr-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: herdr-macos-aarch64
    runs-on: ${{ matrix.os }}
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        if: runner.os != 'macOS'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Restore Homebrew Zig cache
        if: runner.os == 'macOS'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: homebrew-zig-0.15-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            homebrew-zig-0.15-${{ runner.os }}-

      - name: Install patched Zig on macOS
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install zig@0.15
          echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix zig@0.15)/bin/zig" version

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Configure Linux cross linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build a verified binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage release binary
        shell: bash
        run: |
          set -euo pipefail
          cp "target/${{ matrix.target }}/release/herdr" "${{ matrix.artifact }}"

      - name: Verify static Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          file "${{ matrix.artifact }}" | tee BUILD_INFO.txt
          grep -Eq 'statically linked|static-pie linked' BUILD_INFO.txt
          if readelf -l "${{ matrix.artifact }}" | grep -q 'INTERP'; then
            echo "error: Linux release artifact contains a dynamic interpreter" >&2
            exit 1
          fi
          if nm -u "${{ matrix.artifact }}" 2>/dev/null | grep -Eq '(__cxa|GLIBCXX|CXXABI|_ZSt)'; then
            echo "error: Linux release artifact has unresolved C++ runtime symbols" >&2
            exit 1
          fi
          if [ "${{ matrix.target }}" = x86_64-unknown-linux-musl ]; then
            test "$(./${{ matrix.artifact }} --version)" = "herdr ${{ needs.prepare.outputs.version }}"
          fi

      - name: Sign and notarize macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          signing_keychain="$RUNNER_TEMP/herdr-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          application_certificate="$RUNNER_TEMP/developer-id-application.p12"
          installer_certificate="$RUNNER_TEMP/developer-id-installer.p12"
          notarization_archive="$RUNNER_TEMP/${{ matrix.artifact }}.zip"
          package_root="$RUNNER_TEMP/herdr-package-root"
          package="${{ matrix.artifact }}.pkg"
          cleanup() {
            security delete-keychain "$signing_keychain" >/dev/null 2>&1 || true
            rm -rf "$package_root"
            rm -f "$application_certificate" "$installer_certificate" "$notarization_archive"
          }
          trap cleanup EXIT

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$application_certificate"
          printf '%s' "$APPLE_INSTALLER_CERTIFICATE_BASE64" | base64 --decode > "$installer_certificate"
          chmod 600 "$application_certificate" "$installer_certificate"
          # security import validates the PKCS#12 bundle and password. Do not
          # preflight with OpenSSL: legacy Developer ID exports can use RC2-40.

          # Match xcsh's proven release path: import both identities into one
          # default keychain and rely on the certificate chains in the bundles.
          security create-keychain -p "$keychain_password" "$signing_keychain"
          security default-keychain -s "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
          security unlock-keychain -p "$keychain_password" "$signing_keychain"
          security list-keychain -d user -s "$signing_keychain"
          security import "$application_certificate" -k "$signing_keychain" \
            -f pkcs12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$signing_keychain"
          security import "$installer_certificate" -k "$signing_keychain" \
            -f pkcs12 -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" \
            -T /usr/bin/pkgbuild -T /usr/bin/productsign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$signing_keychain"

          application_identity="$(
            security find-identity -v -p codesigning "$signing_keychain" \
              | awk -v team="$APPLE_TEAM_ID" \
                'index($0, "Developer ID Application:") && index($0, "(" team ")") {
                  match($0, /"[^"]+"/); print substr($0, RSTART + 1, RLENGTH - 2); exit
                }'
          )"
          installer_identity="$(
            security find-identity -v "$signing_keychain" \
              | awk -v team="$APPLE_TEAM_ID" \
                'index($0, "Developer ID Installer:") && index($0, "(" team ")") {
                  match($0, /"[^"]+"/); print substr($0, RSTART + 1, RLENGTH - 2); exit
                }'
          )"
          if [ -z "$application_identity" ] || [ -z "$installer_identity" ]; then
            echo "error: imported keychain does not contain the requested Developer ID Application and Installer identities" >&2
            security find-identity -v "$signing_keychain" >&2 || true
            exit 1
          fi

          codesign --force --options runtime --timestamp \
            --sign "$application_identity" "${{ matrix.artifact }}"
          codesign --verify --strict --verbose=4 "${{ matrix.artifact }}"
          ditto -c -k --keepParent "${{ matrix.artifact }}" "$notarization_archive"
          notarization_accepted=false
          for attempt in 1 2 3; do
            notary_exit=0
            notary_output="$(xcrun notarytool submit "$notarization_archive" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait --verbose 2>&1)" || notary_exit=$?
            printf '%s\n' "$notary_output"
            if [ "$notary_exit" -eq 0 ] && grep -q 'status: Accepted' <<< "$notary_output"; then
              notarization_accepted=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          if [ "$notarization_accepted" != true ]; then
            echo "error: Apple did not accept the notarization submission" >&2
            exit 1
          fi

          signing_details="$(codesign -d --verbose=4 "${{ matrix.artifact }}" 2>&1)"
          grep -F "Authority=Developer ID Application:" <<< "$signing_details"
          grep -F "TeamIdentifier=$APPLE_TEAM_ID" <<< "$signing_details"
          if grep -Fq 'Signature=adhoc' <<< "$signing_details"; then
            echo "error: macOS release artifact is only ad-hoc signed" >&2
            exit 1
          fi
          # Bare Mach-O tools cannot carry a stapled ticket; wait briefly for
          # Apple's online Gatekeeper verdict after accepted notarization.
          gatekeeper_accepted=false
          for attempt in 1 2 3 4 5 6 7 8; do
            if spctl --assess --type execute --verbose=4 "${{ matrix.artifact }}"; then
              gatekeeper_accepted=true
              break
            fi
            [ "$attempt" -eq 8 ] || sleep 15
          done
          if [ "$gatekeeper_accepted" != true ]; then
            echo "error: Gatekeeper did not accept the notarized macOS binary" >&2
            exit 1
          fi

          mkdir -p "$package_root/usr/local/bin"
          cp "${{ matrix.artifact }}" "$package_root/usr/local/bin/herdr"
          pkgbuild --root "$package_root" \
            --identifier com.f5.herdr \
            --version "${{ needs.prepare.outputs.version }}" \
            --install-location / \
            --sign "$installer_identity" \
            "$package"

          package_accepted=false
          for attempt in 1 2 3; do
            notary_exit=0
            notary_output="$(xcrun notarytool submit "$package" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait --verbose 2>&1)" || notary_exit=$?
            printf '%s\n' "$notary_output"
            if [ "$notary_exit" -eq 0 ] && grep -q 'status: Accepted' <<< "$notary_output"; then
              package_accepted=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          if [ "$package_accepted" != true ]; then
            echo "error: Apple did not accept the macOS installer package" >&2
            exit 1
          fi
          xcrun stapler staple "$package"
          xcrun stapler validate "$package"
          pkgutil --check-signature "$package" | grep -F 'Developer ID Installer'
          spctl --assess --type install --verbose=4 "$package"

      - name: Verify macOS architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          expected_arch="${{ matrix.target }}"
          expected_arch="${expected_arch%%-*}"
          actual_arch="$(lipo -archs "${{ matrix.artifact }}")"
          test "$actual_arch" = "$expected_arch"

      - name: Write artifact checksum
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import hashlib, pathlib; path = pathlib.Path('${{ matrix.artifact }}'); print(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}')" > "${{ matrix.artifact }}.sha256"

      - name: Write macOS package checksum
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          package="${{ matrix.artifact }}.pkg"
          python3 -c "import hashlib, pathlib; path = pathlib.Path('$package'); print(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}')" > "$package.sha256"

      - name: Upload release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
            ${{ matrix.artifact }}.pkg
            ${{ matrix.artifact }}.pkg.sha256

  control-manager-package:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify pinned release source and tag
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "${TAG}^{commit}")" = "$RELEASE_SHA"

      - name: Run portable Control Manager checks
        run: python3 contrib/control-manager/scripts/control_archive.py test --source-root contrib/control-manager

      - name: Build deterministic Control Manager archive
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          TAG: v${{ needs.prepare.outputs.version }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          python3 contrib/control-manager/scripts/control_archive.py build \
            --source-root contrib/control-manager --output-dir control-manager-release \
            --version "$VERSION" --release-tag "$TAG" --source-sha "$RELEASE_SHA"
          python3 contrib/control-manager/scripts/control_archive.py attest \
            --archive "control-manager-release/control-manager-${VERSION}.tar.gz" \
            --checksum "control-manager-release/control-manager-${VERSION}.tar.gz.sha256" \
            --provenance "control-manager-release/control-manager-${VERSION}.provenance.json" \
            --expected-tag "$TAG" --expected-source-sha "$RELEASE_SHA"

      - name: Upload Control Manager release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: control-manager-release
          path: control-manager-release/

  publish:
    needs: [prepare, build, control-manager-package]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8

      - name: Verify release binary checksums
        shell: bash
        run: |
          set -euo pipefail
          : > SHA256SUMS
          for artifact in \
            herdr-linux-x86_64 \
            herdr-linux-aarch64 \
            herdr-macos-x86_64 \
            herdr-macos-aarch64; do
            (cd "$artifact" && shasum -a 256 -c "${artifact}.sha256")
            cat "$artifact/${artifact}.sha256" >> SHA256SUMS
          done
          for package in herdr-macos-x86_64.pkg herdr-macos-aarch64.pkg; do
            directory="${package%.pkg}"
            (cd "$directory" && shasum -a 256 -c "${package}.sha256")
            cat "$directory/${package}.sha256" >> SHA256SUMS
          done
          sort -k2 -o SHA256SUMS SHA256SUMS

      - name: Verify Control Manager asset provenance
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          TAG: v${{ needs.prepare.outputs.version }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          python3 contrib/control-manager/scripts/control_archive.py attest \
            --archive "control-manager-release/control-manager-${VERSION}.tar.gz" \
            --checksum "control-manager-release/control-manager-${VERSION}.tar.gz.sha256" \
            --provenance "control-manager-release/control-manager-${VERSION}.provenance.json" \
            --expected-tag "$TAG" --expected-source-sha "$RELEASE_SHA"

      - name: Create the fork-owned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; preserving the immutable release."
            exit 0
          fi
          gh release create "$TAG" \
            herdr-linux-x86_64/herdr-linux-x86_64 \
            herdr-linux-x86_64/herdr-linux-x86_64.sha256 \
            herdr-linux-aarch64/herdr-linux-aarch64 \
            herdr-linux-aarch64/herdr-linux-aarch64.sha256 \
            herdr-macos-x86_64/herdr-macos-x86_64 \
            herdr-macos-x86_64/herdr-macos-x86_64.sha256 \
            herdr-macos-x86_64/herdr-macos-x86_64.pkg \
            herdr-macos-x86_64/herdr-macos-x86_64.pkg.sha256 \
            herdr-macos-aarch64/herdr-macos-aarch64 \
            herdr-macos-aarch64/herdr-macos-aarch64.sha256 \
            herdr-macos-aarch64/herdr-macos-aarch64.pkg \
            herdr-macos-aarch64/herdr-macos-aarch64.pkg.sha256 \
            SHA256SUMS \
            control-manager-release/control-manager-${{ needs.prepare.outputs.version }}.tar.gz \
            control-manager-release/control-manager-${{ needs.prepare.outputs.version }}.tar.gz.sha256 \
            control-manager-release/control-manager-${{ needs.prepare.outputs.version }}.provenance.json \
            --title "$TAG" --generate-notes

      - name: Verify published release is immutable
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .immutable)" = true

  publish-homebrew:
    needs: [prepare, publish]
    if: needs.prepare.outputs.release == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          path: herdr-source
          persist-credentials: false

      - name: Checkout the Homebrew tap
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: f5-sales-demo/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Download published checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir checksums
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'herdr-*.sha256' --dir checksums

      - id: formula
        name: Render the cross-platform formula and managed macOS cask
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          python3 herdr-source/scripts/render_downstream_homebrew_formula.py \
            --version "$VERSION" \
            --checksums-dir checksums \
            --formula-output homebrew-tap/herdr.rb \
            --cask-output homebrew-tap/Casks/herdr.rb
          ruby -c homebrew-tap/herdr.rb
          ruby -c homebrew-tap/Casks/herdr.rb
          git -C homebrew-tap diff --check
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add herdr.rb Casks/herdr.rb
          if git -C homebrew-tap diff --cached --quiet; then
            echo "Homebrew formula is already at v$VERSION."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -C homebrew-tap commit -m "herdr: update to v$VERSION"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Install and test the rendered formula
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          brew untap f5-sales-demo/tap >/dev/null 2>&1 || true
          if brew command trust >/dev/null 2>&1; then
            brew trust --formula f5-sales-demo/tap/herdr
          fi
          HOMEBREW_NO_AUTO_UPDATE=1 brew tap --custom-remote \
            f5-sales-demo/tap "file://$GITHUB_WORKSPACE/homebrew-tap"
          HOMEBREW_NO_AUTO_UPDATE=1 brew install f5-sales-demo/tap/herdr
          HOMEBREW_NO_AUTO_UPDATE=1 brew test f5-sales-demo/tap/herdr
          formula_binary="$(brew --prefix f5-sales-demo/tap/herdr)/bin/herdr"
          test "$("$formula_binary" --version)" = "herdr $VERSION"
          codesign --verify --strict "$formula_binary"
          spctl --assess --type execute --verbose=4 "$formula_binary"

      - name: Publish the tap formula
        if: steps.formula.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git -C homebrew-tap pull --rebase origin main
          git -C homebrew-tap push origin HEAD:main

  verify-homebrew-install:
    needs: [prepare, publish-homebrew]
    if: needs.prepare.outputs.release == 'true'
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Verify the immutable installer package before installation
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir release-package
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'herdr-macos-aarch64.pkg' \
            --pattern 'herdr-macos-aarch64.pkg.sha256' \
            --dir release-package
          (
            cd release-package
            shasum -a 256 -c herdr-macos-aarch64.pkg.sha256
            pkgutil --check-signature herdr-macos-aarch64.pkg | grep -F 'Developer ID Installer'
            xcrun stapler validate herdr-macos-aarch64.pkg
            spctl --assess --type install --verbose=4 herdr-macos-aarch64.pkg
          )

      - name: Install the published prebuilt formula
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          brew uninstall --formula --force f5-sales-demo/tap/herdr 2>/dev/null || true
          brew untap f5-sales-demo/tap 2>/dev/null || true
          if brew command trust >/dev/null 2>&1; then
            brew trust --formula f5-sales-demo/tap/herdr
          fi
          brew tap f5-sales-demo/tap
          brew install f5-sales-demo/tap/herdr
          binary="$(brew --prefix f5-sales-demo/tap/herdr)/bin/herdr"
          test "$("$binary" --version)" = "herdr $VERSION"
          codesign --verify --strict "$binary"
          spctl --assess --type execute --verbose=4 "$binary"

      - name: Install the published managed macOS cask
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          brew uninstall --formula --force f5-sales-demo/tap/herdr 2>/dev/null || true
          brew uninstall --cask --force f5-sales-demo/tap/herdr 2>/dev/null || true
          brew install --cask f5-sales-demo/tap/herdr
          pkgutil --pkg-info com.f5.herdr
          binary=/usr/local/bin/herdr
          test -x "$binary"
          test "$("$binary" --version)" = "herdr $VERSION"
          codesign --verify --strict "$binary"
          spctl --assess --type execute --verbose=4 "$binary"
