name: F5 signed distribution

on:
  push:
    tags:
      - "v*-xcsh*"

permissions:
  contents: read

concurrency:
  group: f5-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1
  LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
  LIBGHOSTTY_VT_SIMD: 'true'

jobs:
  build-linux:
    name: Build Linux (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            platform: linux-x86_64
            linker: ''
          - target: aarch64-unknown-linux-musl
            platform: linux-aarch64
            linker: aarch64-linux-gnu-gcc
    runs-on: ubuntu-latest
    env:
      BUILD_TARGET: ${{ matrix.target }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
      TARGET_LINKER: ${{ matrix.linker }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Validate F5 tag and base binary version
        run: python3 scripts/f5_distribution.py validate-tag --tag "$GITHUB_REF_NAME"
      - name: Install Rust target
        run: rustup toolchain install "$RUST_TOOLCHAIN_VERSION" && rustup target add --toolchain "$RUST_TOOLCHAIN_VERSION" "$BUILD_TARGET"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          use-cache: false
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu
      - name: Build native Linux binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: ${{ env.TARGET_LINKER }}
        run: cargo +"$RUST_TOOLCHAIN_VERSION" build --release --locked --target "$BUILD_TARGET"
      - name: Package deterministically twice
        run: |
          python3 scripts/f5_distribution.py package --binary "target/$BUILD_TARGET/release/herdr" --platform "$RELEASE_PLATFORM" --output out-a
          python3 scripts/f5_distribution.py package --binary "target/$BUILD_TARGET/release/herdr" --platform "$RELEASE_PLATFORM" --output out-b
          diff <(sha256sum out-a/* | sed 's|out-a/||') <(sha256sum out-b/* | sed 's|out-b/||')
      - name: Upload verified binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: herdr-${{ matrix.platform }}
          path: out-a/*

  build-macos:
    name: Build and notarize macOS (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos-aarch64
    runs-on: ${{ matrix.runner }}
    environment: f5-release
    env:
      BUILD_TARGET: ${{ matrix.target }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Validate F5 tag and base binary version
        run: python3 scripts/f5_distribution.py validate-tag --tag "$GITHUB_REF_NAME"
      - name: Install Rust target
        run: rustup toolchain install "$RUST_TOOLCHAIN_VERSION" && rustup target add --toolchain "$RUST_TOOLCHAIN_VERSION" "$BUILD_TARGET"
      - name: Install native build tools
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja zig@0.15
      - name: Import Developer ID certificate into ephemeral keychain
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/certificate.p12"
      - name: Build native macOS binary
        run: cargo +"$RUST_TOOLCHAIN_VERSION" build --release --locked --target "$BUILD_TARGET"
      - name: Sign and notarize binary
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          binary="target/$BUILD_TARGET/release/herdr"
          identity=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application[^"]*\)".*/\1/p' | head -1)
          test -n "$identity"
          codesign --force --options runtime --timestamp --sign "$identity" "$binary"
          codesign --verify --deep --strict --verbose=2 "$binary"
          ditto -c -k --keepParent "$binary" "$RUNNER_TEMP/herdr.zip"
          xcrun notarytool submit "$RUNNER_TEMP/herdr.zip" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --output-format json > "$RUNNER_TEMP/notary.json"
          jq -e '.status == "Accepted"' "$RUNNER_TEMP/notary.json" >/dev/null || { cat "$RUNNER_TEMP/notary.json"; echo 'status: Accepted required'; exit 1; }
      - name: Verify signed binary
        run: |
          binary="target/$BUILD_TARGET/release/herdr"
          codesign --verify --deep --strict --verbose=2 "$binary"
          codesign -dvv "$binary" 2>&1 | grep -q 'runtime'
          spctl --assess --verbose=4 --type execute "$binary"
      - name: Package deterministically twice
        run: |
          python3 scripts/f5_distribution.py package --binary "target/$BUILD_TARGET/release/herdr" --platform "$RELEASE_PLATFORM" --output out-a
          python3 scripts/f5_distribution.py package --binary "target/$BUILD_TARGET/release/herdr" --platform "$RELEASE_PLATFORM" --output out-b
          diff <(shasum -a 256 out-a/* | sed 's|out-a/||') <(shasum -a 256 out-b/* | sed 's|out-b/||')
      - name: Upload verified binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: herdr-${{ matrix.platform }}
          path: out-a/*

  release:
    name: Assemble inactive F5 channel release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the immutable GitHub release and upload its assets
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Download verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: herdr-*
          path: dist
          merge-multiple: true
      - name: Generate complete manifest checksums installer and formula
        run: |
          python3 scripts/f5_distribution.py validate-tag --tag "$GITHUB_REF_NAME"
          python3 scripts/f5_distribution.py manifest --tag "$GITHUB_REF_NAME" --artifacts dist --output dist/f5-latest.json
          python3 scripts/f5_distribution.py formula --manifest dist/f5-latest.json --output dist/herdr.rb
          cp install.sh dist/install.sh
      - name: Create F5 release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          generate_release_notes: true
          files: |
            dist/herdr-linux-x86_64
            dist/herdr-linux-aarch64
            dist/herdr-macos-x86_64
            dist/herdr-macos-aarch64
            dist/herdr-linux-x86_64.tar.gz
            dist/herdr-linux-aarch64.tar.gz
            dist/herdr-macos-x86_64.tar.gz
            dist/herdr-macos-aarch64.tar.gz
            dist/SHA256SUMS
            dist/f5-latest.json
            dist/install.sh
            dist/herdr.rb
