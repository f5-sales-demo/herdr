name: PR Gate

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  link-fork-issue:
    name: Link fork issue
    runs-on: ubuntu-latest
    steps:
      - name: Verify and record issue linkage
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ github.token }}
          script: |
            const pullNumber = context.payload.pull_request.number;
            const marker = `<!-- herdr:pr-link:${pullNumber} -->`;
            const query = `query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $number) {
                  closingIssuesReferences(first: 10) { nodes { number url } }
                }
              }
            }`;
            const data = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: pullNumber,
            });
            const issues = data.repository.pullRequest.closingIssuesReferences.nodes;
            if (issues.length === 0) {
              core.setFailed('Link a fork issue with a closing reference such as "Fixes #123" before CI admission.');
              return;
            }

            const prUrl = context.payload.pull_request.html_url;
            for (const issue of issues) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100,
              });
              const body = `${marker}\nTracked by [PR #${pullNumber}](${prUrl}). Automated validation is running.`;
              const existing = comments.find(comment => comment.body?.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body,
                });
              }
            }
            core.notice(`Issue linkage recorded: ${issues.map(issue => `#${issue.number}`).join(', ')}`);
