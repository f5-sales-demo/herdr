name: Windows ARM64 installer

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/windows-arm64.yml"
      - "scripts/windows_arm64_installer_test.ps1"
      - "distribution/install.ps1"
      - "distribution/latest.json"
  push:
    branches: [build-xcsh]
    paths:
      - ".github/workflows/windows-arm64.yml"
      - "scripts/windows_arm64_installer_test.ps1"
      - "distribution/install.ps1"
      - "distribution/latest.json"

permissions:
  contents: read

concurrency:
  group: windows-arm64-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: installer
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Test stable x86_64 fallback installation
        shell: powershell
        env:
          HERDR_MANIFEST_URL: https://raw.githubusercontent.com/f5-sales-demo/herdr/${{ github.event.pull_request.head.sha || github.sha }}/distribution/latest.json
        run: .\scripts\windows_arm64_installer_test.ps1
